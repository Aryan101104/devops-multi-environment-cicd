name: Production Deployment

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:

  dev:
    name: DEV
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Development validation
        run: |
          echo "Starting DEV stage"
          echo "Environment: DEV"
          echo "Running development checks"
          test -f index.html
          echo "DEV stage completed successfully"


  test:
    name: TEST
    runs-on: ubuntu-latest
    needs: dev

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Test validation
        run: |
          echo "Starting TEST stage"
          echo "Environment: TEST"
          echo "Running tests"
          test -f index.html
          echo "HTML file validation passed"
          echo "TEST stage completed successfully"


  prod:
    name: PROD
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Production validation
        run: |
          echo "Starting PROD stage"
          echo "Environment: PROD"
          echo "Running production validation"
          test -f index.html
          echo "Production validation passed"
          echo "PROD stage completed successfully"


  deploy:
    name: DEPLOY
    runs-on: ubuntu-latest
    needs: prod

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout production code
        uses: actions/checkout@v4

      - name: Verify production build
        run: |
          echo "Starting final production deployment"
          test -f index.html
          echo "Production code verified"

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
